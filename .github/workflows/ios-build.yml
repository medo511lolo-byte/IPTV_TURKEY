name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    - name: Install CocoaPods
      run: sudo gem install cocoapods

    - name: Get dependencies
      run: flutter pub get

    - name: Build iOS (no codesign)
      run: flutter build ios --release --no-codesign

    - name: Archive with Xcode (no signing)
      run: |
        cd ios
        xcodebuild -workspace Runner.xcworkspace \
          -scheme Runner \
          -configuration Release \
          -archivePath $PWD/build/Runner.xcarchive \
          clean archive \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

    - name: Export IPA
      run: |
        cd ios
        mkdir -p $PWD/build/ipa
        /usr/bin/xcodebuild -exportArchive \
          -archivePath $PWD/build/Runner.xcarchive \
          -exportPath $PWD/build/ipa \
          -exportOptionsPlist exportOptions.plist || true
        if ls $PWD/build/ipa/*.ipa 1> /dev/null 2>&1; then
          echo "Exported IPA found"
        else
          echo "Fallback: zip Runner.app into IPA"
          cd $PWD/..
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r iptv_turkey.ipa Payload
          mv iptv_turkey.ipa ios/build/ipa/
        fi

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: IPTV-TURKEY-iOS
        path: |
          ios/build/ipa/*.ipa
          ios/build/Runner.xcarchive
