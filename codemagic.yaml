workflows:
  ios-build:
    name: Build iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get --no-example || true
      
      - name: Build Flutter iOS App (xcarchive)
        script: |
          flutter build ios --release --no-codesign 2>&1 || true

      - name: Build unsigned IPA (preferred)
        script: |
          # Produces build/ios/ipa/Runner.ipa when supported
          flutter build ipa --release --no-codesign 2>&1 || true

      - name: Save build logs
        script: |
          echo "Build completed - Check artifacts above"
      
      - name: Package Runner.app into IPA
        script: |
          set -e
          echo "Searching for Runner.app..."
          APP_PATH=""
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/iphoneos/Runner.app"
          else
            # Fallback: search anywhere in build tree
            APP_PATH=$(find build -type d -name "Runner.app" | head -n 1 || true)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found. Showing build output paths for debugging:"
            find build -maxdepth 5 -type d -name "Runner.app" || true
            # Do not fail the whole build, just skip IPA creation
            exit 0
          fi

          echo "Found Runner.app at: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app

          echo "Creating IPA from Payload..."
          if command -v ditto >/dev/null 2>&1; then
            ditto -ck --sequesterRsrc --keepParent Payload iptv_turkey.ipa || true
          else
            (cd . && zip -r -q iptv_turkey.ipa Payload) || true
          fi
          ls -la iptv_turkey.ipa 2>/dev/null || echo "IPA file not created; check artifacts for Payload/Runner.app"
    
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/**
      - build/**/Runner.app/**
      - Payload/**
      - iptv_turkey.ipa
