workflows:
  ios-build:
    name: Build iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get --no-example || true
      
      - name: Build Flutter iOS App
        script: |
          flutter build ios --release --no-codesign 2>&1 || true
      
      - name: Create Payload directory for IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/ 2>/dev/null || true
      
      - name: Create IPA file
        script: |
          cd . && zip -r -q iptv_turkey.ipa Payload 2>/dev/null || echo "IPA creation attempt finished"
          ls -la iptv_turkey.ipa 2>/dev/null || echo "IPA file not found, trying alternative..."
          ls -la build/ios/iphoneos/ 2>/dev/null || true
    
    artifacts:
      - build/ios/iphoneos/**
      - iptv_turkey.ipa
    post_build:
      scripts:
        - name: Save build logs
          script: |
            echo "Build completed - Check artifacts above"
